services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leaf
      POSTGRES_USER: leaf
      POSTGRES_PASSWORD: leaf_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - leaf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaf -d leaf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leaf_postgres_data:
